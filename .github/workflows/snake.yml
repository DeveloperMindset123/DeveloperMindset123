name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: DeveloperMindset123
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7dd3fc&color_dots=#f1f5f9,#ffd6e0,#ffb3c6,#ff8fab,#fb6f92
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7dd3fc&color_dots=#161b22,#5c2a3a,#9d3c5e,#e75a86,#ff8fab

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
