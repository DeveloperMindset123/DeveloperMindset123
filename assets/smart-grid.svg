<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b3a"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ff8fab" stop-opacity=".9"/><stop offset="1" stop-color="#ff8fab" stop-opacity="0"/></radialGradient>
<radialGradient id="glowb"><stop offset="0" stop-color="#7dd3fc" stop-opacity=".9"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></radialGradient>
<pattern id="gridp" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#334155" stroke-width=".5" opacity=".5"/></pattern>
</defs>
<style>
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes flowr{to{stroke-dashoffset:40}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes scan{0%{transform:translateY(-10px)}100%{transform:translateY(310px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.trunk{stroke:#ff8fab;stroke-width:2.5;fill:none;stroke-dasharray:6 14;animation:flow 1.2s linear infinite}
.mesh{stroke:#7dd3fc;stroke-width:1.2;fill:none;stroke-dasharray:3 9;opacity:.75;animation:flowr 2s linear infinite}
.base{stroke:#475569;stroke-width:1;fill:none}
.halo{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
.win{fill:#fde68a;animation:blink 3s ease-in-out infinite}
.scan{animation:scan 6s linear infinite}
.blade{transform-box:fill-box;transform-origin:50% 100%;animation:spin 3s linear infinite}
.lbl{font:600 9px 'Fira Code',Consolas,monospace;fill:#cbd5e1}
.ttl{font:700 13px 'Fira Code',Consolas,monospace;fill:#ff8fab;letter-spacing:2px}
</style>
